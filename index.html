<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6750a4">
<title>MultiTimer</title>
<style>
/* ============ Material Design 3 tokens ============ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius-s: 8px; --radius-m: 16px; --radius-l: 28px; --radius-full: 999px;
  --e1: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.14);
  --e2: 0 3px 6px rgba(0,0,0,.14), 0 2px 4px rgba(0,0,0,.12);
  --e3: 0 10px 20px rgba(0,0,0,.16), 0 3px 6px rgba(0,0,0,.14);
}
html[data-theme="light"]{
  --primary:#6750a4; --on-primary:#ffffff; --primary-container:#eaddff; --on-primary-container:#21005d;
  --secondary-container:#e8def8; --on-secondary-container:#1d192b;
  --tertiary-container:#ffd8e4; --on-tertiary-container:#31111d;
  --surface:#fef7ff; --on-surface:#1d1b20; --on-surface-variant:#49454f;
  --surface-container-lowest:#ffffff; --surface-container-low:#f7f2fa;
  --surface-container:#f3edf7; --surface-container-high:#ece6f0; --surface-container-highest:#e6e0e9;
  --outline:#79747e; --outline-variant:#cac4d0;
  --error:#ba1a1a; --on-error:#ffffff; --error-container:#ffdad6; --on-error-container:#410002;
  --success:#146c2e; --success-container:#a6f2b8;
  --scrim:rgba(0,0,0,.45);
  color-scheme: light;
}
html[data-theme="dark"]{
  --primary:#d0bcff; --on-primary:#381e72; --primary-container:#4f378b; --on-primary-container:#eaddff;
  --secondary-container:#4a4458; --on-secondary-container:#e8def8;
  --tertiary-container:#633b48; --on-tertiary-container:#ffd8e4;
  --surface:#141218; --on-surface:#e6e0e9; --on-surface-variant:#cac4d0;
  --surface-container-lowest:#0f0d13; --surface-container-low:#1d1b20;
  --surface-container:#211f26; --surface-container-high:#2b2930; --surface-container-highest:#36343b;
  --outline:#938f99; --outline-variant:#49454f;
  --error:#ffb4ab; --on-error:#690005; --error-container:#93000a; --on-error-container:#ffdad6;
  --success:#7bda9b; --success-container:#0e4d22;
  --scrim:rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font); background:var(--surface); color:var(--on-surface);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
#app{max-width:640px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; position:relative;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}

/* ============ Top app bar ============ */
.app-bar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 8px 10px 16px;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--surface-container-high);
}
.app-title{font-size:22px; font-weight:600; letter-spacing:.2px; flex:1; display:flex; align-items:center; gap:10px;}
.app-title .logo{width:34px; height:34px; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--primary-container));
  display:flex; align-items:center; justify-content:center; box-shadow:var(--e1);}
.app-title .logo svg{width:20px; height:20px; stroke:var(--on-primary); fill:none; stroke-width:2.4; stroke-linecap:round;}
.icon-btn{
  width:44px; height:44px; border-radius:var(--radius-full); border:0; background:transparent; color:var(--on-surface-variant);
  display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; flex:none;
  transition:background .18s, transform .12s;
}
.icon-btn:active{transform:scale(.92);}
.icon-btn:hover{background:color-mix(in srgb, var(--on-surface) 8%, transparent);}
.icon-btn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.running-badge{
  position:absolute; top:6px; right:6px; min-width:18px; height:18px; padding:0 5px; border-radius:var(--radius-full);
  background:var(--error); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.85}}

/* ============ Board tabs ============ */
.board-tabs{display:flex; gap:8px; align-items:center; padding:12px 16px 4px; overflow-x:auto; scrollbar-width:none;}
.board-tabs::-webkit-scrollbar{display:none;}
.board-chip{
  flex:none; display:flex; align-items:center; gap:6px; padding:9px 16px; border-radius:var(--radius-s);
  border:1px solid var(--outline-variant); background:var(--surface-container-low); color:var(--on-surface-variant);
  font-size:14px; font-weight:500; cursor:pointer; transition:all .18s; max-width:170px;
}
.board-chip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.board-chip.active{background:var(--secondary-container); color:var(--on-secondary-container); border-color:transparent; font-weight:600;}
.board-chip .cnt{font-size:11px; background:color-mix(in srgb, var(--on-surface) 10%, transparent); border-radius:var(--radius-full); padding:1px 7px;}
.board-add{flex:none; width:40px; height:40px; border-radius:var(--radius-full); border:1.5px dashed var(--outline);
  background:transparent; color:var(--on-surface-variant); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.board-add:active{transform:scale(.9);}

/* ============ Board summary card ============ */
.board-summary{
  margin:12px 16px 4px; padding:18px; border-radius:var(--radius-l);
  background:linear-gradient(135deg, var(--primary-container), color-mix(in srgb, var(--primary-container) 55%, var(--tertiary-container)));
  color:var(--on-primary-container); box-shadow:var(--e1); position:relative; overflow:hidden;
}
.board-summary .bs-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.board-summary h2{margin:0; font-size:19px; font-weight:600;}
.bs-stats{display:flex; gap:18px; margin:12px 0;}
.bs-stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:.7; font-weight:600;}
.bs-stat .val{font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px;}
.bs-bar{height:10px; border-radius:var(--radius-full); background:rgba(0,0,0,.12); overflow:hidden;}
html[data-theme="dark"] .bs-bar{background:rgba(255,255,255,.14);}
.bs-bar > div{height:100%; border-radius:var(--radius-full); background:var(--primary); transition:width .3s linear;}
.bs-foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:13px; opacity:.85;}

/* ============ Timer cards ============ */
.timer-list{padding:12px 16px 8px; display:flex; flex-direction:column; gap:12px;}
.timer-card{
  --tc:#6750a4;
  background:var(--surface-container-low); border-radius:var(--radius-l); padding:14px 14px 14px 16px;
  box-shadow:var(--e1); display:flex; gap:14px; align-items:center; position:relative; overflow:hidden;
  border-left:5px solid var(--tc);
  animation:cardIn .3s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes cardIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}
.timer-card.running{background:color-mix(in srgb, var(--tc) 10%, var(--surface-container-low));}
.timer-card .ring{flex:none; width:74px; height:74px; position:relative;}
.timer-card .ring svg{width:74px; height:74px; transform:rotate(-90deg);}
.timer-card .ring .bg{stroke:var(--surface-container-highest); fill:none; stroke-width:7;}
.timer-card .ring .fg{stroke:var(--tc); fill:none; stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset .25s linear;}
.timer-card .ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--on-surface-variant); font-variant-numeric:tabular-nums;}
.timer-info{flex:1; min-width:0;}
.timer-name{font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.timer-note{font-size:12px; color:var(--on-surface-variant); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
.timer-time{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.5px; margin-top:2px;}
.timer-sub{font-size:11px; color:var(--on-surface-variant); margin-top:1px;}
.timer-actions{flex:none; display:flex; flex-direction:column; gap:6px; align-items:center;}
.play-btn{
  width:56px; height:56px; border-radius:var(--radius-full); border:0; cursor:pointer;
  background:var(--tc); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:var(--e2);
  transition:transform .15s, box-shadow .15s; position:relative; overflow:hidden;
}
.play-btn:active{transform:scale(.9);}
.play-btn svg{width:24px; height:24px; fill:currentColor;}
.play-btn.running{animation:pulse 1.6s ease-in-out infinite;}
.row-btns{display:flex; gap:2px;}
.mini-btn{width:32px; height:32px; border-radius:var(--radius-full); border:0; background:transparent; color:var(--on-surface-variant);
  display:flex; align-items:center; justify-content:center; cursor:pointer;}
.mini-btn:active{transform:scale(.88);}
.mini-btn:hover{background:color-mix(in srgb, var(--on-surface) 8%, transparent);}
.mini-btn svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.mini-btn.danger{color:var(--error);}

/* ============ FAB & bottom nav ============ */
.fab{
  position:fixed; bottom:calc(96px + env(safe-area-inset-bottom)); right:max(20px, calc(50% - 320px + 20px));
  width:60px; height:60px; border-radius:20px; border:0; cursor:pointer; z-index:30;
  background:var(--primary-container); color:var(--on-primary-container); box-shadow:var(--e3);
  display:flex; align-items:center; justify-content:center; transition:transform .15s;
}
.fab:active{transform:scale(.9) rotate(90deg);}
.fab svg{width:26px; height:26px; stroke:currentColor; stroke-width:2.4; stroke-linecap:round;}
.bottom-nav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:640px; z-index:25;
  display:flex; background:var(--surface-container); border-top:1px solid var(--surface-container-high);
  padding:6px 8px calc(10px + env(safe-area-inset-bottom));
}
.nav-item{flex:1; border:0; background:transparent; color:var(--on-surface-variant); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 5px; font-size:12px; font-weight:500; border-radius:var(--radius-m);}
.nav-item .pill{padding:4px 18px; border-radius:var(--radius-full); transition:background .2s;}
.nav-item.active{color:var(--on-surface);}
.nav-item.active .pill{background:var(--secondary-container); color:var(--on-secondary-container);}
.nav-item svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

/* ============ Views ============ */
.view{padding:4px 0 8px; animation:viewIn .25s ease;}
@keyframes viewIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.section-title{font-weight:600; margin:18px 20px 8px; color:var(--on-surface-variant); text-transform:uppercase; letter-spacing:.8px; font-size:12px;}

/* ============ History ============ */
.seg{display:flex; background:var(--surface-container-high); border-radius:var(--radius-full); padding:4px; margin:12px 16px; gap:2px;}
.seg button{flex:1; border:0; background:transparent; color:var(--on-surface-variant); font-size:14px; font-weight:600;
  padding:9px 0; border-radius:var(--radius-full); cursor:pointer; transition:all .2s;}
.seg button.active{background:var(--surface-container-lowest); color:var(--on-surface); box-shadow:var(--e1);}
.hist-total{margin:4px 16px 0; padding:20px; border-radius:var(--radius-l); background:var(--primary-container);
  color:var(--on-primary-container); text-align:center; box-shadow:var(--e1);}
.hist-total .big{font-size:38px; font-weight:800; font-variant-numeric:tabular-nums;}
.hist-total .cap{font-size:13px; opacity:.75; margin-top:4px;}
.chart-card{margin:12px 16px 0; padding:16px; border-radius:var(--radius-l); background:var(--surface-container-low); box-shadow:var(--e1);}
.chart-card canvas{width:100%; height:170px; display:block;}
.hist-list{margin:4px 16px 0; display:flex; flex-direction:column; gap:8px;}
.hist-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-m);
  background:var(--surface-container-low); box-shadow:var(--e1);}
.hist-row .dot{width:12px; height:12px; border-radius:var(--radius-full); flex:none;}
.hist-row .nm{flex:1; min-width:0;}
.hist-row .nm b{display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hist-row .nm small{color:var(--on-surface-variant); font-size:12px;}
.hist-row .tm{font-weight:700; font-variant-numeric:tabular-nums; font-size:14px;}

/* ============ Settings ============ */
.set-card{margin:4px 16px 0; border-radius:var(--radius-l); background:var(--surface-container-low); box-shadow:var(--e1); overflow:hidden;}
.set-row{display:flex; align-items:center; gap:14px; padding:15px 16px; border:0; width:100%; background:transparent;
  color:var(--on-surface); font-size:15px; text-align:left; cursor:pointer; font-family:var(--font);}
.set-row + .set-row{border-top:1px solid var(--surface-container-high);}
.set-row:active{background:color-mix(in srgb, var(--on-surface) 5%, transparent);}
.set-row svg{width:22px; height:22px; fill:none; stroke:var(--on-surface-variant); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none;}
.set-row .grow{flex:1;}
.set-row .grow small{display:block; color:var(--on-surface-variant); font-size:12px; margin-top:2px;}
.set-row.danger{color:var(--error);}
.set-row.danger svg{stroke:var(--error);}
.switch{flex:none; width:52px; height:32px; border-radius:var(--radius-full); border:2px solid var(--outline);
  background:transparent; position:relative; cursor:pointer; transition:all .2s; padding:0;}
.switch::after{content:""; position:absolute; top:50%; left:4px; transform:translateY(-50%); width:16px; height:16px;
  border-radius:var(--radius-full); background:var(--outline); transition:all .2s;}
.switch.on{background:var(--primary); border-color:var(--primary);}
.switch.on::after{left:26px; width:22px; height:22px; background:var(--on-primary);}

/* ============ Dialogs ============ */
.dialog-scrim{position:fixed; inset:0; background:var(--scrim); z-index:50; display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@media(min-width:560px){.dialog-scrim{align-items:center;}}
.dialog{background:var(--surface-container-high); border-radius:var(--radius-l) var(--radius-l) 0 0; width:100%; max-width:520px;
  max-height:92dvh; overflow-y:auto; padding:8px 24px calc(24px + env(safe-area-inset-bottom)); box-shadow:var(--e3);
  animation:sheetUp .28s cubic-bezier(.2,.9,.3,1);}
@media(min-width:560px){.dialog{border-radius:var(--radius-l);}}
@keyframes sheetUp{from{transform:translateY(60px); opacity:0;} to{transform:none; opacity:1;}}
.dialog h3{font-size:20px; margin:14px 0 4px;}
.dialog .sub{font-size:13px; color:var(--on-surface-variant); margin:0 0 14px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--on-surface-variant); margin-bottom:6px;}
.field input[type=text]{
  width:100%; padding:13px 16px; border-radius:var(--radius-s); border:1.5px solid var(--outline-variant);
  background:var(--surface-container-lowest); color:var(--on-surface); font-size:16px; font-family:var(--font); outline:none; transition:border .15s;}
.field input[type=text]:focus{border-color:var(--primary);}
.dur-row{display:flex; gap:10px;}
.dur-box{flex:1; text-align:center;}
.dur-box input{width:100%; padding:12px 4px; border-radius:var(--radius-s); border:1.5px solid var(--outline-variant);
  background:var(--surface-container-lowest); color:var(--on-surface); font-size:22px; font-weight:700; text-align:center;
  font-variant-numeric:tabular-nums; outline:none; font-family:var(--font);}
.dur-box input:focus{border-color:var(--primary);}
.dur-box small{display:block; margin-top:4px; color:var(--on-surface-variant); font-size:11px; text-transform:uppercase; letter-spacing:1px;}
.color-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:10px;}
.color-dot{aspect-ratio:1; border-radius:var(--radius-full); border:0; cursor:pointer; position:relative; transition:transform .15s;}
.color-dot:active{transform:scale(.85);}
.color-dot.sel::after{content:""; position:absolute; inset:-5px; border:2.5px solid var(--primary); border-radius:var(--radius-full);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0;}
.toggle-row .t b{display:block; font-size:15px;}
.toggle-row .t small{color:var(--on-surface-variant); font-size:12px;}
.dialog-btns{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
.btn{border:0; border-radius:var(--radius-full); padding:12px 24px; font-size:15px; font-weight:600; cursor:pointer; font-family:var(--font); transition:transform .12s;}
.btn:active{transform:scale(.95);}
.btn-text{background:transparent; color:var(--primary);}
.btn-filled{background:var(--primary); color:var(--on-primary); box-shadow:var(--e1);}
.btn-danger{background:var(--error); color:var(--on-error);}

/* ============ Snackbar & empty state ============ */
#snackbar{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(100px + env(safe-area-inset-bottom));
  background:#322f35; color:#f5eff7; padding:13px 20px; border-radius:var(--radius-s); font-size:14px; z-index:60;
  opacity:0; pointer-events:none; transition:all .3s; box-shadow:var(--e3); max-width:90vw; text-align:center;}
html[data-theme="dark"] #snackbar{background:#e6e0e9; color:#1d1b20;}
#snackbar.show{opacity:1; transform:translateX(-50%) translateY(0);}
.empty{text-align:center; padding:56px 32px; color:var(--on-surface-variant);}
.empty svg{width:72px; height:72px; stroke:var(--outline-variant); fill:none; stroke-width:1.4; margin-bottom:14px;}
.empty h4{margin:0 0 6px; font-size:17px; color:var(--on-surface);}
.empty p{margin:0 0 16px; font-size:14px;}
.hidden-file{display:none;}
</style>
</head>
<body>
<div id="app">
  <header class="app-bar">
    <div class="app-title">
      <span class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span>
      MultiTimer
    </div>
    <button class="icon-btn" id="btnTheme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn" id="btnRunning" aria-label="Running timers">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span class="running-badge" id="runningBadge" style="display:none">0</span>
    </button>
  </header>

  <!-- TIMERS VIEW -->
  <div class="view" id="view-timers">
    <nav class="board-tabs" id="boardTabs"></nav>
    <section id="boardSummary"></section>
    <section class="timer-list" id="timerList"></section>
  </div>

  <!-- HISTORY VIEW -->
  <div class="view" id="view-history" hidden>
    <div class="seg" id="histSeg">
      <button data-range="day" class="active">Daily</button>
      <button data-range="week">Weekly</button>
      <button data-range="month">Monthly</button>
    </div>
    <div class="hist-total">
      <div class="big" id="histBig">0:00</div>
      <div class="cap" id="histCap">focused today</div>
    </div>
    <div class="chart-card"><canvas id="histChart" width="600" height="340"></canvas></div>
    <div class="section-title">Breakdown</div>
    <div class="hist-list" id="histList"></div>
  </div>

  <!-- SETTINGS VIEW -->
  <div class="view" id="view-settings" hidden>
    <div class="section-title">Appearance &amp; alerts</div>
    <div class="set-card" id="setCardAlerts"></div>
    <div class="section-title">Data</div>
    <div class="set-card" id="setCardData"></div>
    <div class="section-title">About</div>
    <div class="set-card">
      <div class="set-row" style="cursor:default">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>
        <div class="grow">MultiTimer<b style="display:block;font-weight:400;font-size:13px;color:var(--on-surface-variant)">Single-file app · your data never leaves this browser</b></div>
      </div>
    </div>
  </div>

  <button class="fab" id="fab" aria-label="Add timer">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="timers">
      <span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
      Timers
    </button>
    <button class="nav-item" data-view="history">
      <span class="pill"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></span>
      History
    </button>
    <button class="nav-item" data-view="settings">
      <span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1z"/></svg></span>
      Settings
    </button>
  </nav>
</div>

<div id="dialogRoot"></div>
<div id="snackbar"></div>
<input type="file" id="importFile" class="hidden-file" accept="application/json">
<script>
"use strict";
/* ================================================================
   MultiTimer — single-file app. All state in localStorage.
   Timer model: {id,name,color,dur(sec),note,loop,st,rem(ms),endAt(ms)}
   st: 'idle' | 'run' | 'pause'
================================================================ */
const LS_KEY = "multitimer_v1";
const COLORS = ["#6750a4","#d81b60","#7b1fa2","#3949ab","#1976d2","#0288d1",
  "#00897b","#2e7d32","#689f38","#f9a825","#ef6c00","#e64a19"];

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const mm = String(m).padStart(h > 0 ? 2 : 1, "0"), ss = String(s).padStart(2, "0");
  return h > 0 ? h + ":" + mm + ":" + ss : m + ":" + ss;
}
function fmtMs(ms){ return fmtDur(ms / 1000); }
function fmtLong(sec){
  sec = Math.round(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60);
  if (h > 0) return h + "h " + m + "m";
  if (m > 0) return m + "m";
  return sec + "s";
}

/* ---------------- state ---------------- */
function seedState(){
  const b1 = uid();
  return {
    v: 1,
    activeBoard: b1,
    activeView: "timers",
    histRange: "day",
    boards: [{
      id: b1, name: "Study",
      timers: [
        {id: uid(), name: "Focus", color: "#6750a4", dur: 25*60, note: "Deep work session", loop: false, st: "idle", rem: 25*60*1000, endAt: 0},
        {id: uid(), name: "Short break", color: "#00897b", dur: 5*60, note: "Stretch & water", loop: false, st: "idle", rem: 5*60*1000, endAt: 0}
      ]
    }],
    history: [],
    settings: { theme: "light", sound: true, vibrate: true, notify: false, notifyStart: true }
  };
}
function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return seedState();
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.boards)) return seedState();
    s.settings = Object.assign({theme:"light", sound:true, vibrate:true, notify:false, notifyStart:true}, s.settings || {});
    s.history = Array.isArray(s.history) ? s.history : [];
    // Timers that were running while the page was closed: settle them now.
    const now = Date.now();
    s.boards.forEach(b => (b.timers||[]).forEach(t => {
      t.st = t.st || "idle";
      t.rem = typeof t.rem === "number" ? t.rem : (t.dur||0)*1000;
      if (t.st === "run") {
        const rem = (t.endAt || now) - now;
        if (rem <= 0) { // finished while away — log it, reset
          s.history.push({id: uid(), boardName: b.name, timerName: t.name, color: t.color, seconds: t.dur, at: t.endAt || now});
          t.rem = t.dur * 1000;
          t.st = t.loop ? "run" : "idle";
          if (t.st === "run") t.endAt = now + t.rem; else t.endAt = 0;
        } else { t.rem = rem; }
      }
    }));
    if (!s.boards.find(b => b.id === s.activeBoard)) s.activeBoard = (s.boards[0]||{}).id || null;
    return s;
  } catch(e){ return seedState(); }
}
let S = loadState();
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
  }, 150);
}
function activeBoard(){ return S.boards.find(b => b.id === S.activeBoard) || null; }
function findTimer(tid){
  for (const b of S.boards) {
    const t = (b.timers||[]).find(x => x.id === tid);
    if (t) return {board: b, timer: t};
  }
  return null;
}

/* ---------------- timer engine (timestamp-based, background-safe) ---------------- */
function remMs(t){ return t.st === "run" ? Math.max(0, t.endAt - Date.now()) : Math.max(0, t.rem); }
function elapsedMs(t){ return Math.max(0, t.dur * 1000 - remMs(t)); }

function startTimer(t){
  if (t.st === "run" || t.dur <= 0) return;
  t.endAt = Date.now() + remMs(t);
  t.st = "run";
  save(); refreshTimerCard(t.id); updateSummary(); updateBadge();
  const found = findTimer(t.id);
  if (found) showStartNotif(found.board, t);
}
function pauseTimer(t){
  if (t.st !== "run") return;
  t.rem = Math.max(0, t.endAt - Date.now());
  t.st = "pause"; t.endAt = 0;
  save(); refreshTimerCard(t.id); updateSummary(); updateBadge();
  const found = findTimer(t.id);
  if (found) showPauseNotif(found.board, t);
}
function resetTimer(t){
  closeNotif(t.id);
  t.st = "idle"; t.rem = t.dur * 1000; t.endAt = 0;
  save(); refreshTimerCard(t.id); updateSummary(); updateBadge();
}
function endTimer(board, t){
  const elapsedSec = Math.round(elapsedMs(t) / 1000);
  if (elapsedSec <= 0) { resetTimer(t); return; }
  S.history.push({id: uid(), boardName: board.name, timerName: t.name, color: t.color, seconds: elapsedSec, at: Date.now(), partial: true});
  closeNotif(t.id);
  t.st = "idle"; t.rem = t.dur * 1000; t.endAt = 0;
  save(); refreshTimerCard(t.id); updateSummary(); updateBadge();
  snack("Ended “" + t.name + "” — logged " + fmtLong(elapsedSec));
  if (S.activeView === "history") renderHistory();
}
function finishTimer(board, t){
  S.history.push({id: uid(), boardName: board.name, timerName: t.name, color: t.color, seconds: t.dur, at: Date.now()});
  alertFinish(t);
  t.rem = t.dur * 1000;
  if (t.loop && t.dur > 0) { t.endAt = Date.now() + t.rem; t.st = "run"; showStartNotif(board, t); }
  else { t.st = "idle"; t.endAt = 0; }
  save(); refreshTimerCard(t.id); updateSummary(); updateBadge();
  if (S.activeView === "history") renderHistory();
}

/* ---------------- alerts: sound + vibration + notification ---------------- */
let audioCtx = null;
function beep(){
  if (!S.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx, now = ctx.currentTime;
    [0, .22, .44].forEach((off, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = i === 2 ? 1046 : 880;
      g.gain.setValueAtTime(0.0001, now + off);
      g.gain.exponentialRampToValueAtTime(0.5, now + off + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(now + off); o.stop(now + off + 0.25);
    });
  } catch(e){}
}
function alertFinish(t){
  closeNotif(t.id);
  beep();
  if (S.settings.vibrate && navigator.vibrate) { try { navigator.vibrate([180, 80, 180]); } catch(e){} }
  snack("Finished: " + t.name);
  if (S.settings.notify && "Notification" in window && Notification.permission === "granted") {
    try { new Notification("Timer finished", {body: t.name + " · " + fmtDur(t.dur)}); } catch(e){}
  }
  // Flash the tab title briefly
  const orig = document.title;
  let n = 0;
  const iv = setInterval(() => {
    document.title = (n % 2 === 0) ? "⏰ " + t.name + " finished!" : orig;
    if (++n > 7) { clearInterval(iv); document.title = orig; }
  }, 900);
}

/* ---------------- status notifications (stay in the phone's notification bar) ---------------- */
const activeNotifs = {};
let notifWarned = false;
function closeNotif(tid){
  const n = activeNotifs[tid];
  if (n) { try { n.close(); } catch(e){} delete activeNotifs[tid]; }
}
function notifBlockedMsg(){
  return location.protocol === "file:"
    ? "Notifications are blocked for local files — open this page over http(s) to get bar notifications."
    : "Notifications are blocked — allow them in Chrome: Settings → Site settings → Notifications.";
}
function postStatusNotif(board, t, title, body){
  if (!S.settings.notifyStart || !("Notification" in window)) return;
  if (Notification.permission === "denied" && !notifWarned) {
    notifWarned = true;
    snack(notifBlockedMsg());
    return;
  }
  const show = () => {
    if (Notification.permission !== "granted") return;
    closeNotif(t.id);
    try {
      const n = new Notification(title, {
        body: body,
        tag: "multitimer-" + t.id,
        requireInteraction: true,
        silent: true
      });
      n.onclick = () => { try { window.focus(); } catch(e){} };
      activeNotifs[t.id] = n;
    } catch(e){}
  };
  if (Notification.permission === "default") {
    try { Notification.requestPermission().then(p => { if (p === "granted") show(); }); } catch(e){}
  } else show();
}
function showStartNotif(board, t){
  postStatusNotif(board, t, t.name + " — timer started", board.name + " · " + fmtDur(t.dur) + " total");
}
function showPauseNotif(board, t){
  postStatusNotif(board, t, t.name + " — paused", fmtMs(remMs(t)) + " left · tap to return to MultiTimer");
}
/* Diagnostic: tells the user exactly why notifications do/don't work on their device. */
async function testNotification(){
  if (!("Notification" in window)) { snack("This browser doesn't support notifications. Try Chrome."); return; }
  let perm = Notification.permission;
  if (perm === "default") {
    try { perm = await Notification.requestPermission(); } catch(e){ perm = "denied"; }
    refreshNotifPermLabel();
  }
  if (perm !== "granted") {
    snack(perm === "denied" ? notifBlockedMsg() : "Notification permission is " + perm + ".");
    return;
  }
  try {
    const n = new Notification("MultiTimer test", {
      body: "If you can see this in your notification bar, notifications work.",
      tag: "multitimer-test",
      requireInteraction: true
    });
    snack("Test sent — check your notification bar");
    setTimeout(() => { try { n.close(); } catch(e){} }, 12000);
  } catch(e) {
    snack("Couldn't post notification: " + (e && e.message ? e.message : e));
  }
}
function refreshNotifPermLabel(){
  const el = $("#notifPermLabel");
  if (!el) return;
  if (!("Notification" in window)) { el.textContent = "Not supported by this browser — use Chrome"; return; }
  const p = Notification.permission;
  el.textContent = "Permission: " + p +
    (p === "granted" ? " — you're good" : p === "denied" ? " — blocked" : " — not asked yet");
}

/* ---------------- snackbar ---------------- */
let snackTimer = null;
function snack(msg){
  const el = $("#snackbar");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ================================================================
   RENDERING
================================================================ */
const RING_C = 2 * Math.PI * 30;

function renderAll(){
  renderBoardTabs();
  renderSummary();
  renderTimerList();
  updateBadge();
  if (S.activeView === "history") renderHistory();
  if (S.activeView === "settings") renderSettings();
}

/* ---------- board tabs ---------- */
function renderBoardTabs(){
  const el = $("#boardTabs");
  el.innerHTML = S.boards.map(b =>
    '<button class="board-chip' + (b.id === S.activeBoard ? " active" : "") + '" data-bid="' + b.id + '">' +
    "<span>" + esc(b.name) + '</span><span class="cnt">' + (b.timers||[]).length + "</span></button>"
  ).join("") + '<button class="board-add" id="boardAdd" aria-label="Add board">+</button>';
  $$(".board-chip", el).forEach(ch => ch.addEventListener("click", () => {
    S.activeBoard = ch.dataset.bid; save();
    renderBoardTabs(); renderSummary(); renderTimerList();
  }));
  $("#boardAdd").addEventListener("click", () => boardDialog(null));
}

/* ---------- board summary ---------- */
function renderSummary(){
  const b = activeBoard(), el = $("#boardSummary");
  if (!b) {
    el.innerHTML = '<div class="empty" style="padding:32px">' +
      '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></svg>' +
      "<h4>No boards yet</h4><p>Create a board like “Study” or “Morning” to get started.</p>" +
      '<button class="btn btn-filled" id="emptyBoardBtn">Create board</button></div>';
    const btn = $("#emptyBoardBtn");
    if (btn) btn.addEventListener("click", () => boardDialog(null));
    return;
  }
  el.innerHTML =
    '<div class="board-summary"><div class="bs-head"><h2>' + esc(b.name) + '</h2>' +
    '<button class="icon-btn" id="boardMenuBtn" aria-label="Board options" style="color:var(--on-primary-container)">' +
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button></div>' +
    '<div class="bs-stats">' +
    '<div class="bs-stat"><div class="lbl">Total</div><div class="val" id="bsTotal">0:00</div></div>' +
    '<div class="bs-stat"><div class="lbl">Done</div><div class="val" id="bsElapsed">0:00</div></div>' +
    '<div class="bs-stat"><div class="lbl">Left</div><div class="val" id="bsLeft">0:00</div></div>' +
    "</div>" +
    '<div class="bs-bar"><div id="bsBar" style="width:0%"></div></div>' +
    '<div class="bs-foot"><span id="bsRun">0 running</span><span id="bsTimers">0 timers</span></div></div>';
  $("#boardMenuBtn").addEventListener("click", () => boardMenuDialog(b));
  updateSummary();
}
function updateSummary(){
  const b = activeBoard();
  if (!b || !$("#bsTotal")) return;
  const timers = b.timers || [];
  let total = 0, elapsed = 0, left = 0, running = 0;
  timers.forEach(t => {
    total += t.dur * 1000;
    elapsed += elapsedMs(t);
    left += remMs(t);
    if (t.st === "run") running++;
  });
  $("#bsTotal").textContent = fmtMs(total);
  $("#bsElapsed").textContent = fmtMs(elapsed);
  $("#bsLeft").textContent = fmtMs(left);
  $("#bsBar").style.width = (total > 0 ? Math.min(100, elapsed / total * 100) : 0) + "%";
  $("#bsRun").textContent = running + " running";
  $("#bsTimers").textContent = timers.length + (timers.length === 1 ? " timer" : " timers");
}

/* ---------- timer list ---------- */
function timerCardHTML(t){
  const frac = t.dur > 0 ? Math.min(1, elapsedMs(t) / (t.dur * 1000)) : 0;
  const off = RING_C * (1 - frac);
  const sub = t.st === "run" ? "Running" : t.st === "pause" ? "Paused at " + fmtMs(t.rem) : "Ready · " + fmtDur(t.dur) + (t.loop ? " · loops" : "");
  const endBtn = (t.st === "run" || t.st === "pause")
    ? '<button class="mini-btn" data-act="end" aria-label="End timer" title="End now & save to history"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg></button>'
    : "";
  return (
    '<div class="ring"><svg viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="30"/>' +
    '<circle class="fg" cx="37" cy="37" r="30" stroke-dasharray="' + RING_C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>' +
    '<div class="pct">' + Math.round(frac * 100) + '%</div></div>' +
    '<div class="timer-info"><div class="timer-name">' + esc(t.name) + '</div>' +
    (t.note ? '<div class="timer-note">' + esc(t.note) + '</div>' : "") +
    '<div class="timer-time">' + fmtMs(remMs(t)) + '</div>' +
    '<div class="timer-sub">' + sub + '</div></div>' +
    '<div class="timer-actions">' +
    '<button class="play-btn' + (t.st === "run" ? " running" : "") + '" data-act="toggle" aria-label="' + (t.st === "run" ? "Pause" : "Start") + '">' +
    (t.st === "run"
      ? '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>') +
    '</button><div class="row-btns">' +
    endBtn +
    '<button class="mini-btn" data-act="edit" aria-label="Edit"><svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>' +
    '<button class="mini-btn" data-act="reset" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>' +
    '<button class="mini-btn danger" data-act="del" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>' +
    "</div></div>"
  );
}
function renderTimerList(){
  const b = activeBoard(), el = $("#timerList");
  if (!b) { el.innerHTML = ""; return; }
  const timers = b.timers || [];
  if (!timers.length) {
    el.innerHTML = '<div class="empty">' +
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>' +
      "<h4>No timers yet</h4><p>Tap + to add your first timer to “" + esc(b.name) + "”.</p></div>";
    return;
  }
  el.innerHTML = timers.map(t =>
    '<article class="timer-card' + (t.st === "run" ? " running" : "") + '" data-tid="' + t.id + '" style="--tc:' + t.color + '">' +
    timerCardHTML(t) + "</article>"
  ).join("");
  // Clicks are handled by one delegated listener on #timerList (see init).
}
function handleTimerAction(tid, act){
  const found = findTimer(tid);
  if (!found) return;
  const {board, timer} = found;
  if (act === "toggle") timer.st === "run" ? pauseTimer(timer) : startTimer(timer);
  else if (act === "reset") { resetTimer(timer); snack("Timer reset"); }
  else if (act === "end") endTimer(board, timer);
  else if (act === "edit") timerDialog(board, timer);
  else if (act === "del") confirmDialog("Delete timer?", "“" + timer.name + "” will be removed from this board.", () => {
    closeNotif(tid);
    board.timers = board.timers.filter(x => x.id !== tid);
    save(); renderBoardTabs(); renderTimerList(); updateSummary(); snack("Timer deleted");
  });
}
function refreshTimerCard(tid){
  const found = findTimer(tid);
  if (!found) return;
  const card = $('.timer-card[data-tid="' + tid + '"]');
  if (!card) { renderTimerList(); return; }
  card.classList.toggle("running", found.timer.st === "run");
  card.style.setProperty("--tc", found.timer.color);
  card.innerHTML = timerCardHTML(found.timer);
  // No rebinding needed: clicks are delegated on #timerList.
}

/* ---------- tick loop ---------- */
function tick(){
  const now = Date.now();
  let changed = false;
  S.boards.forEach(b => (b.timers || []).forEach(t => {
    if (t.st !== "run") return;
    if (t.endAt <= now) { finishTimer(b, t); changed = true; return; }
    const card = $('.timer-card[data-tid="' + t.id + '"]');
    if (card) {
      const rem = Math.max(0, t.endAt - now);
      const frac = t.dur > 0 ? Math.min(1, (t.dur * 1000 - rem) / (t.dur * 1000)) : 0;
      const timeEl = $(".timer-time", card), fg = $(".ring .fg", card),
            pct = $(".ring .pct", card), sub = $(".timer-sub", card);
      if (timeEl) timeEl.textContent = fmtMs(rem);
      if (fg) fg.setAttribute("stroke-dashoffset", (RING_C * (1 - frac)).toFixed(1));
      if (pct) pct.textContent = Math.round(frac * 100) + "%";
      if (sub) sub.textContent = "Running";
    }
  }));
  if (S.activeBoard) updateSummary();
  updateBadge();
  if (changed) save();
}
function updateBadge(){
  let n = 0;
  S.boards.forEach(b => (b.timers || []).forEach(t => { if (t.st === "run") n++; }));
  const badge = $("#runningBadge");
  badge.style.display = n > 0 ? "flex" : "none";
  badge.textContent = n;
}

/* ================================================================
   DIALOGS
================================================================ */
function openDialog(html){
  closeDialog();
  const scrim = document.createElement("div");
  scrim.className = "dialog-scrim"; scrim.id = "dialogScrim";
  scrim.innerHTML = '<div class="dialog" role="dialog">' + html + "</div>";
  scrim.addEventListener("mousedown", e => { if (e.target === scrim) closeDialog(); });
  $("#dialogRoot").appendChild(scrim);
  const first = $(".dialog input[type=text]", scrim);
  if (first) setTimeout(() => first.focus(), 80);
  return scrim;
}
function closeDialog(){
  const s = $("#dialogScrim");
  if (s) s.remove();
}
function confirmDialog(title, msg, onYes){
  const scrim = openDialog("<h3>" + esc(title) + '</h3><p class="sub">' + esc(msg) + "</p>" +
    '<div class="dialog-btns"><button class="btn btn-text" id="cfNo">Cancel</button>' +
    '<button class="btn btn-danger" id="cfYes">Delete</button></div>');
  $("#cfNo", scrim).addEventListener("click", closeDialog);
  $("#cfYes", scrim).addEventListener("click", () => { closeDialog(); onYes(); });
}

/* ---------- timer add/edit ---------- */
function timerDialog(board, t){
  const isEdit = !!t;
  const dur = t ? t.dur : 25 * 60;
  const hh = Math.floor(dur / 3600), mm = Math.floor(dur % 3600 / 60), ss = dur % 60;
  const selColor = t ? t.color : COLORS[0];
  const html =
    "<h3>" + (isEdit ? "Edit timer" : "New timer") + '</h3><p class="sub">' + esc(board.name) + " board</p>" +
    '<div class="field"><label>Timer name</label><input type="text" id="tdName" maxlength="40" placeholder="e.g. Focus" value="' + esc(t ? t.name : "") + '"></div>' +
    '<div class="field"><label>Duration</label><div class="dur-row">' +
    '<div class="dur-box"><input id="tdH" inputmode="numeric" pattern="[0-9]*" value="' + hh + '"><small>Hrs</small></div>' +
    '<div class="dur-box"><input id="tdM" inputmode="numeric" pattern="[0-9]*" value="' + mm + '"><small>Min</small></div>' +
    '<div class="dur-box"><input id="tdS" inputmode="numeric" pattern="[0-9]*" value="' + ss + '"><small>Sec</small></div>' +
    "</div></div>" +
    '<div class="field"><label>Color</label><div class="color-grid" id="tdColors">' +
    COLORS.map(c => '<button class="color-dot' + (c === selColor ? " sel" : "") + '" data-c="' + c + '" style="background:' + c + '" aria-label="color"></button>').join("") +
    "</div></div>" +
    '<div class="field"><label>Note (optional)</label><input type="text" id="tdNote" maxlength="60" placeholder="e.g. Chapter 5 revision" value="' + esc(t ? (t.note || "") : "") + '"></div>' +
    '<div class="toggle-row"><div class="t"><b>Loop when finished</b><small>Auto-restart instead of stopping</small></div>' +
    '<button class="switch' + (t && t.loop ? " on" : "") + '" id="tdLoop" aria-label="Loop"></button></div>' +
    '<div class="dialog-btns"><button class="btn btn-text" id="tdCancel">Cancel</button>' +
    '<button class="btn btn-filled" id="tdSave">' + (isEdit ? "Save" : "Add timer") + "</button></div>";
  const scrim = openDialog(html);
  let color = selColor;
  $$("#tdColors .color-dot", scrim).forEach(d => d.addEventListener("click", () => {
    $$("#tdColors .color-dot", scrim).forEach(x => x.classList.remove("sel"));
    d.classList.add("sel"); color = d.dataset.c;
  }));
  const loopBtn = $("#tdLoop", scrim);
  loopBtn.addEventListener("click", () => loopBtn.classList.toggle("on"));
  $("#tdCancel", scrim).addEventListener("click", closeDialog);
  const num = id => Math.max(0, parseInt(($("#" + id, scrim).value || "0"), 10) || 0);
  $("#tdSave", scrim).addEventListener("click", () => {
    const name = $("#tdName", scrim).value.trim() || "Timer";
    const total = num("tdH") * 3600 + num("tdM") * 60 + num("tdS");
    if (total <= 0) { snack("Set a duration greater than 0"); return; }
    const note = $("#tdNote", scrim).value.trim();
    const loop = loopBtn.classList.contains("on");
    if (isEdit) {
      const wasRunning = t.st === "run";
      t.name = name; t.color = color; t.note = note; t.loop = loop;
      if (t.dur !== total) { t.dur = total; t.rem = total * 1000; if (wasRunning) t.endAt = Date.now() + t.rem; else { t.st = "idle"; t.endAt = 0; } }
      snack("Timer updated");
    } else {
      board.timers.push({id: uid(), name, color, dur: total, note, loop, st: "idle", rem: total * 1000, endAt: 0});
      snack("Timer added");
    }
    save(); closeDialog();
    renderBoardTabs(); renderTimerList(); updateSummary();
  });
}

/* ---------- board add/rename ---------- */
function boardDialog(b){
  const isEdit = !!b;
  const scrim = openDialog("<h3>" + (isEdit ? "Rename board" : "New board") + "</h3>" +
    '<p class="sub">' + (isEdit ? "Give this board a new name." : "Boards group your timers — e.g. Study, Morning, Workout.") + "</p>" +
    '<div class="field"><label>Board name</label><input type="text" id="bdName" maxlength="30" placeholder="e.g. Morning" value="' + esc(b ? b.name : "") + '"></div>' +
    '<div class="dialog-btns"><button class="btn btn-text" id="bdCancel">Cancel</button>' +
    '<button class="btn btn-filled" id="bdSave">' + (isEdit ? "Save" : "Create") + "</button></div>");
  $("#bdCancel", scrim).addEventListener("click", closeDialog);
  const doSave = () => {
    const name = $("#bdName", scrim).value.trim();
    if (!name) { snack("Give the board a name"); return; }
    if (isEdit) { b.name = name; snack("Board renamed"); }
    else {
      const nb = {id: uid(), name, timers: []};
      S.boards.push(nb); S.activeBoard = nb.id;
      snack("Board created");
    }
    save(); closeDialog(); renderBoardTabs(); renderSummary(); renderTimerList();
  };
  $("#bdSave", scrim).addEventListener("click", doSave);
  $("#bdName", scrim).addEventListener("keydown", e => { if (e.key === "Enter") doSave(); });
}

/* ---------- board options ---------- */
function boardMenuDialog(b){
  const scrim = openDialog("<h3>" + esc(b.name) + '</h3><p class="sub">Board options</p>' +
    '<div class="dialog-btns" style="flex-direction:column;align-items:stretch">' +
    '<button class="btn btn-text" id="bmRename" style="text-align:left">Rename board</button>' +
    '<button class="btn btn-text" id="bmDup" style="text-align:left">Duplicate board</button>' +
    '<button class="btn btn-text" id="bmDel" style="text-align:left;color:var(--error)">Delete board</button>' +
    '<button class="btn btn-text" id="bmCancel" style="text-align:left">Cancel</button></div>');
  $("#bmCancel", scrim).addEventListener("click", closeDialog);
  $("#bmRename", scrim).addEventListener("click", () => boardDialog(b));
  $("#bmDup", scrim).addEventListener("click", () => {
    const nb = {
      id: uid(), name: b.name + " copy",
      timers: (b.timers || []).map(t => ({id: uid(), name: t.name, color: t.color, dur: t.dur, note: t.note || "", loop: !!t.loop, st: "idle", rem: t.dur * 1000, endAt: 0}))
    };
    S.boards.push(nb); S.activeBoard = nb.id;
    save(); closeDialog(); renderAll(); snack("Board duplicated");
  });
  $("#bmDel", scrim).addEventListener("click", () => {
    closeDialog();
    confirmDialog("Delete board?", "“" + b.name + "” and its " + (b.timers || []).length + " timer(s) will be removed.", () => {
      (b.timers || []).forEach(x => closeNotif(x.id));
      S.boards = S.boards.filter(x => x.id !== b.id);
      if (S.activeBoard === b.id) S.activeBoard = (S.boards[0] || {}).id || null;
      save(); renderAll(); snack("Board deleted");
    });
  });
}

/* ================================================================
   HISTORY
================================================================ */
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); }
function histBuckets(){
  const range = S.histRange, now = Date.now();
  let labels = [], starts = [], cap = "";
  if (range === "day") {
    const sod = startOfDay(now);
    for (let h = 0; h < 24; h++) { starts.push(sod + h * 3600e3); labels.push(h % 4 === 0 ? h + ":00" : ""); }
    cap = "focused today";
  } else if (range === "week") {
    const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(startOfDay(now) - i * 864e5);
      starts.push(d.getTime()); labels.push(days[d.getDay()]);
    }
    cap = "focused in the last 7 days";
  } else {
    for (let i = 29; i >= 0; i--) {
      const d = new Date(startOfDay(now) - i * 864e5);
      starts.push(d.getTime()); labels.push(i % 5 === 0 ? d.getDate() : "");
    }
    cap = "focused in the last 30 days";
  }
  const step = range === "day" ? 3600e3 : 864e5;
  const vals = starts.map(() => 0);
  const inRange = [];
  S.history.forEach(e => {
    for (let i = 0; i < starts.length; i++) {
      if (e.at >= starts[i] && e.at < starts[i] + step) { vals[i] += e.seconds; inRange.push(e); break; }
    }
  });
  return {labels, vals, cap, entries: inRange};
}
function renderHistory(){
  $$("#histSeg button").forEach(b => b.classList.toggle("active", b.dataset.range === S.histRange));
  const {labels, vals, cap, entries} = histBuckets();
  const total = vals.reduce((a, b) => a + b, 0);
  $("#histBig").textContent = fmtLong(total);
  $("#histCap").textContent = cap;
  drawChart($("#histChart"), labels, vals);
  const el = $("#histList");
  if (!entries.length) {
    el.innerHTML = '<div class="empty" style="padding:28px">' +
      '<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>' +
      "<h4>No history yet</h4><p>Finished timers will show up here.</p></div>";
    return;
  }
  const byTimer = {};
  entries.forEach(e => {
    const k = e.boardName + "|||" + e.timerName;
    if (!byTimer[k]) byTimer[k] = {board: e.boardName, name: e.timerName, color: e.color || "#6750a4", secs: 0, n: 0};
    byTimer[k].secs += e.seconds; byTimer[k].n++;
  });
  const rows = Object.values(byTimer).sort((a, b) => b.secs - a.secs);
  el.innerHTML = rows.map(r =>
    '<div class="hist-row"><span class="dot" style="background:' + r.color + '"></span>' +
    '<div class="nm"><b>' + esc(r.name) + '</b><small>' + esc(r.board) + " · " + r.n + (r.n === 1 ? " session" : " sessions") + "</small></div>" +
    '<div class="tm">' + fmtLong(r.secs) + "</div></div>"
  ).join("");
}
function drawChart(canvas, labels, vals){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 600, h = 170;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
  const max = Math.max.apply(null, vals.concat([1]));
  const n = vals.length, gap = Math.min(8, w / n * 0.35), bw = (w - gap * (n + 1)) / n;
  const base = h - 26, top = 10;
  const css = getComputedStyle(document.documentElement);
  const barColor = css.getPropertyValue("--primary").trim() || "#6750a4";
  const txtColor = css.getPropertyValue("--on-surface-variant").trim() || "#888";
  ctx.fillStyle = txtColor; ctx.font = "10px " + css.getPropertyValue("--font"); ctx.textAlign = "center";
  vals.forEach((v, i) => {
    const bh = Math.max(v > 0 ? 4 : 0, (base - top) * (v / max));
    const x = gap + i * (bw + gap), y = base - bh;
    ctx.fillStyle = v > 0 ? barColor : "transparent";
    if (v > 0) {
      ctx.beginPath();
      const r = Math.min(5, bw / 2);
      ctx.moveTo(x, y + bh);
      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.lineTo(x + bw - r, y); ctx.quadraticCurveTo(x + bw, y, x + bw, y + r);
      ctx.lineTo(x + bw, y + bh); ctx.closePath(); ctx.fill();
    }
    if (labels[i]) { ctx.fillStyle = txtColor; ctx.fillText(labels[i], x + bw / 2, h - 8); }
  });
}

/* ================================================================
   SETTINGS
================================================================ */
function setRow(icon, title, sub, controlHTML, danger){
  return '<div class="set-row' + (danger ? " danger" : "") + '">' + icon +
    '<div class="grow">' + title + (sub ? "<small>" + sub + "</small>" : "") + "</div>" + controlHTML + "</div>";
}
const ICO = {
  bell: '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  theme: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  download: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>',
  upload: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>'
};
function renderSettings(){
  const st = S.settings;
  const sw = (key, on) => '<button class="switch' + (on ? " on" : "") + '" data-set="' + key + '" aria-label="toggle"></button>';
  $("#setCardAlerts").innerHTML =
    setRow(ICO.theme, "Dark mode", "Easy on the eyes at night", sw("theme", st.theme === "dark")) +
    setRow(ICO.bell, "Status notifications", "Show timer start & pause in the notification bar (needs permission)", sw("notifyStart", st.notifyStart)) +
    '<button class="set-row" id="setTestNotif">' + ICO.bell + '<div class="grow">Test notification<small id="notifPermLabel">Checking…</small></div></button>' +
    setRow(ICO.bell, "Finish sound", "Play a chime when a timer ends", sw("sound", st.sound)) +
    setRow(ICO.bell, "Vibration", "Vibrate on timer finish (mobile)", sw("vibrate", st.vibrate)) +
    setRow(ICO.bell, "Finish notification", "System notification when a timer ends", sw("notify", st.notify));
  $("#setCardData").innerHTML =
    '<button class="set-row" id="setExport">' + ICO.download + '<div class="grow">Export data<small>Download all boards, timers &amp; history as JSON</small></div></button>' +
    '<button class="set-row" id="setImport">' + ICO.upload + '<div class="grow">Import data<small>Restore from a previously exported file</small></div></button>' +
    '<button class="set-row danger" id="setClearHist">' + ICO.trash + '<div class="grow">Clear history<small>Delete all recorded sessions</small></div></button>' +
    '<button class="set-row danger" id="setResetAll">' + ICO.trash + '<div class="grow">Reset everything<small>Delete all boards, timers and history</small></div></button>';
  $$("#setCardAlerts .switch").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.set;
    if (key === "theme") { st.theme = st.theme === "dark" ? "light" : "dark"; applyTheme(); }
    else if (key === "notify") {
      st.notify = !st.notify;
      if (st.notify && "Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().then(p => { if (p !== "granted") { st.notify = false; save(); renderSettings(); snack("Notifications blocked by browser"); } });
      }
    }
    else if (key === "notifyStart") {
      st.notifyStart = !st.notifyStart;
      if (st.notifyStart && "Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().then(p => { if (p !== "granted") { st.notifyStart = false; save(); renderSettings(); snack("Notifications blocked by browser"); } });
      }
    }
    else st[key] = !st[key];
    save(); renderSettings();
  }));
  $("#setExport").addEventListener("click", exportData);
  $("#setImport").addEventListener("click", () => $("#importFile").click());
  $("#setClearHist").addEventListener("click", () => confirmDialog("Clear history?", "All recorded timer sessions will be deleted.", () => {
    S.history = []; save(); renderHistory(); snack("History cleared");
  }));
  $("#setResetAll").addEventListener("click", () => confirmDialog("Reset everything?", "All boards, timers and history will be permanently deleted.", () => {
    S = seedState(); save(); applyTheme(); closeDialog(); renderAll(); switchView("timers"); snack("Fresh start!");
  }));
}
function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "multitimer-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  snack("Backup downloaded");
}

/* ================================================================
   NAV / THEME / INIT
================================================================ */
function switchView(v){
  S.activeView = v; save();
  $$(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.view === v));
  $("#view-timers").hidden = v !== "timers";
  $("#view-history").hidden = v !== "history";
  $("#view-settings").hidden = v !== "settings";
  $("#fab").style.display = v === "timers" ? "flex" : "none";
  if (v === "history") renderHistory();
  if (v === "settings") renderSettings();
  window.scrollTo(0, 0);
}
function applyTheme(){
  document.documentElement.dataset.theme = S.settings.theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", S.settings.theme === "dark" ? "#141218" : "#6750a4");
}
function init(){
  applyTheme();
  $("#timerList").addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    const card = e.target.closest(".timer-card");
    if (!btn || !card) return;
    handleTimerAction(card.dataset.tid, btn.dataset.act);
  });
  $$(".nav-item").forEach(n => n.addEventListener("click", () => switchView(n.dataset.view)));
  $$("#histSeg button").forEach(b => b.addEventListener("click", () => {
    S.histRange = b.dataset.range; save(); renderHistory();
  }));
  $("#btnTheme").addEventListener("click", () => {
    S.settings.theme = S.settings.theme === "dark" ? "light" : "dark";
    save(); applyTheme();
    if (S.activeView === "history") renderHistory();
    if (S.activeView === "settings") renderSettings();
  });
  $("#btnRunning").addEventListener("click", () => {
    let first = null;
    S.boards.forEach(b => (b.timers || []).forEach(t => { if (t.st === "run" && !first) first = t; }));
    if (!first) { snack("No timers running"); return; }
    if (S.activeView !== "timers") switchView("timers");
    if (S.activeBoard !== findTimer(first.id).board.id) {
      S.activeBoard = findTimer(first.id).board.id; save();
      renderBoardTabs(); renderSummary(); renderTimerList();
    }
    setTimeout(() => {
      const card = $('.timer-card[data-tid="' + first.id + '"]');
      if (card) card.scrollIntoView({behavior: "smooth", block: "center"});
    }, 60);
  });
  $("#fab").addEventListener("click", () => {
    const b = activeBoard();
    if (!b) boardDialog(null); else timerDialog(b, null);
  });
  $("#importFile").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.boards)) throw new Error("bad");
        S = Object.assign(seedState(), data);
        S.settings = Object.assign({theme:"light", sound:true, vibrate:true, notify:false, notifyStart:true}, data.settings || {});
        if (!S.boards.find(b => b.id === S.activeBoard)) S.activeBoard = (S.boards[0] || {}).id || null;
        save(); applyTheme(); renderAll(); switchView("timers");
        snack("Data imported");
      } catch(err){ snack("Could not read that file"); }
      e.target.value = "";
    };
    r.readAsText(f);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDialog(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  window.addEventListener("resize", () => { if (S.activeView === "history") renderHistory(); });
  switchView(S.activeView || "timers");
  renderAll();
  setInterval(tick, 250);
}
document.addEventListener("DOMContentLoaded", init);
</script>
